manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # PS/2 trackpoint driver, our fork. Forked from
    # infused-kim/kb_zmk_ps2_mouse_trackpoint_driver; the `zephyr-4.1` branch
    # carries the one-line K_KERNEL_STACK_MEMBER fix needed to build against
    # stock zmkfirmware/main (Zephyr 4.1). See patches/kb_ps2_zephyr-4.1.patch.
    - name: tomatocream
      url-base: https://github.com/TomatoCream
  projects:
    # Stock upstream ZMK (Zephyr 4.1). Pointer support (input listeners/
    # processors, mouse keys) lives in main via CONFIG_ZMK_POINTING.
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml

    # PS/2 mouse & trackpoint driver, ported to mainline. The driver already
    # emits standard Zephyr input events; on mainline we use the STOCK
    # zmk,input-listener and never instantiate its bundled
    # zmk,input-listener-ps2 (so src/mouse/ is excluded from the build).
    # Checked out at <workspace>/kb_zmk_ps2_mouse_trackpoint_driver (gitignored).
    - name: kb_zmk_ps2_mouse_trackpoint_driver
      remote: tomatocream
      revision: zephyr-4.1
  self:
    path: config
