manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    # Stock upstream ZMK. Pointer support (mouse-key emulation, input
    # listeners/processors) lives in main now via CONFIG_ZMK_POINTING, and ZMK
    # Studio is available here too. The old infused-kim fork + PS/2 trackpoint
    # driver were dropped: the driver bundled its own listener against the
    # fork's old mouse-HID API, which no longer exists on main.
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
  self:
    path: config
