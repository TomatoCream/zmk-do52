CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_BT_CTLR_TX_PWR_MINUS_8=y

CONFIG_ZMK_DISPLAY=n

# Mouse-key emulation (&mkp / &mmv / &msc). Re-pair BLE hosts after enabling:
# the HID report descriptor changes and some hosts won't pick it up otherwise.
CONFIG_ZMK_POINTING=y

# ZMK Studio (live keymap editing). Plug the central (RIGHT) half into the host
# via USB and connect at studio.zmk.dev (Chrome/Edge). Unlock for editing with
# &studio_unlock (bound on config_layer). The RIGHT build gets the
# studio-rpc-usb-uart snippet (added by zmk.py / build.yaml).
CONFIG_ZMK_STUDIO=y